<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GAI Declaration</title>
<style>
  @page { size: A4; margin: 12mm 15mm; }
  * { box-sizing: border-box; }
  body { margin: 0; color: #111; font: 10pt/1.34 Arial, Helvetica, sans-serif; background: #fff; }
  .page { break-inside: avoid; }
  .page { page-break-after: always; }
  .page:last-child { page-break-after: auto; }
  h1 { font-size: 13.5pt; margin: 0 0 2px; }
  .sub { font-size: 9.5pt; color: #444; margin: 0 0 12px; }
  .row { display: flex; gap: 10px; align-items: baseline; margin: 5px 0; }
  .label { flex: 0 0 auto; }
  .line { flex: 1; border-bottom: 1px solid #333; min-height: 16px; padding: 0 4px; }
  table.meta { width: 100%; border-collapse: collapse; margin: 6px 0 12px; }
  table.meta td { padding: 3px 0; vertical-align: top; }
  table.meta td:first-child { width: 47%; font-weight: bold; }
  ol.opts { list-style: none; padding-left: 0; margin: 4px 0 8px; }
  ol.opts li { display: flex; gap: 10px; margin: 5px 0; }
  ol.opts .n { flex: 0 0 26px; }
  ol.opts .t { flex: 1; }
  .box { flex: 0 0 14px; height: 14px; border: 1.3px solid #111; margin-top: 2px; }
  .or { font-style: italic; margin: 2px 0 2px 36px; color: #333; }
  ul.decl { margin: 4px 0 10px 4px; padding: 0; list-style: none; }
  ul.decl li { margin: 3px 0; }
  .tools { border: 1px solid #999; border-radius: 4px; padding: 7px 10px; margin: 8px 0 10px; font-size: 9.4pt; background: #f7f7f7; }
  .tools b.h { display: block; margin-bottom: 3px; }
  .tools ul { margin: 2px 0 0 16px; padding: 0; }
  .tools li { margin: 1.5px 0; }
  .sign { display: flex; gap: 28px; margin-top: 14px; }
  .sign div { flex: 1; }
  .sign .line { min-height: 26px; }
  .cap { font-size: 9pt; color: #444; margin-top: 3px; }
</style>
</head>
<body>
<!--MEMBER_PAGES-->
<template id="member-page">
<section class="page">
  <h1>Declaration on Use of GAI (Generative Artificial Intelligence) Assistance</h1>
  <p class="sub">in relation to a hackathon project submission (to be completed individually by each team member, even for group projects)</p>

  <div class="row"><span class="label">I (student name),</span><span class="line">{{NAME}}</span></div>
  <div class="row"><span class="line"></span><span class="label">@e.ntu.edu.sg (NTU email)</span></div>
  <p style="margin:6px 0 2px">honestly and sincerely make the following declaration in relation to the following submission:</p>

  <table class="meta">
    <tr><td>1. Event:</td><td>Learn to Hack: MATLAB Edition 2026 (Hackathon), 30 October 2026</td></tr>
    <tr><td>2. Challenge:</td><td>MathWorks Hackathon: Predicting Building Energy Consumption</td></tr>
    <tr><td>3. Judges / organisers:</td><td>Hackathon judging panel</td></tr>
    <tr><td>4. Team:</td><td>Group 1 – Matrix Not Found (Yeong Sir Chung, Matthew Roberto, Rohit Panda)</td></tr>
    <tr><td>5. Title of project submission:</td><td>Retrofit Radar: Predicting Building Energy Consumption with MATLAB<br><span style="font-size:9pt">github.com/Roh00t/MatrixNotFound · roh00t.github.io/MatrixNotFound</span></td></tr>
  </table>

  <p style="margin:4px 0">In relation to the foregoing I hereby declare that, in accordance with the hackathon rules, I have (check all that apply to <b>my own</b> contribution):</p>
  <ol class="opts">
    <li><span class="box"></span><span class="n">i.</span><span class="t">Used GAI to assist in generating key ideas.</span></li>
    <li><span class="box"></span><span class="n">ii.</span><span class="t">Used GAI to assist in generating first drafts of text (e.g. documentation, slides, Devpost text).</span></li>
    <li><span class="box"></span><span class="n">iii.</span><span class="t">Used GAI to refine syntax and grammar.</span></li>
    <li><span class="box"></span><span class="n">iv.</span><span class="t">Used GAI to assist in writing, debugging or reviewing code and analysis, which I reviewed, ran and verified myself.</span></li>
    <li><span class="box"></span><span class="n">v.</span><span class="t">Used GAI to generate media assets (e.g. 3D models, images or video).</span></li>
  </ol>
  <p class="or">Or</p>
  <ol class="opts">
    <li><span class="box"></span><span class="n">vi.</span><span class="t">Not used GAI assistance in any way in my contribution to this project.</span></li>
  </ol>

  <div class="tools">
    <b class="h">Team disclosure: GAI tools used in this project</b>
    <ul>
      <li><b>Claude Code (Anthropic):</b> MATLAB pipeline code, validation design, dashboard and 3D-simulator web code, documentation, and presentation editing.</li>
      <li><b>AI coding agent in Visual Studio Code:</b> parts of the independent cross-check pipeline, tests and documentation.</li>
      <li><b>Gemini (Google):</b> planning advice and prompt drafting.</li>
      <li><b>Meshy AI:</b> generated the 3D models of The Hive and The Arc used in the simulator.</li>
    </ul>
    <div style="margin-top:4px">All AI-assisted code was run and verified in MATLAB (unit tests and a clean-room rerun that reproduced the submission byte for byte).</div>
  </div>

  <p style="margin:4px 0">I also declare that I have:</p>
  <ul class="decl">
    <li>a. Fully and honestly submitted the digital paper trail: the project's complete Git commit history in the public repository;</li>
    <li>b. Acknowledged GAI assistance wherever it was used, in the project documentation (GUARDRAILS.md, section "Working with AI assistants"; README credits) and on the simulator page for the AI-generated 3D models; and</li>
    <li>c. Apart from the foregoing notices, the submission is the team's own work, and I have personally reviewed the parts I contributed.</li>
  </ul>

  <div class="sign">
    <div><div class="line">{{NAME}}</div><div class="cap">Student name</div></div>
    <div><div class="line"></div><div class="cap">Signature</div></div>
    <div style="flex:0 0 26%"><div class="line"></div><div class="cap">Date</div></div>
  </div>
</section>
</template>
<script>
  // One page per team member; each member ticks, signs and dates their own page.
  const members = ["Yeong Sir Chung", "Matthew Roberto", "Rohit Panda"];
  const tpl = document.getElementById("member-page").innerHTML;
  document.body.insertAdjacentHTML("afterbegin",
    members.map((m) => tpl.replaceAll("{{NAME}}", m)).join(""));
</script>
</body>
</html>
